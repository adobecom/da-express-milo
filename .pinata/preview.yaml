# How the harness turns a branch + page into something it can screenshot for
# Express.
#
# Express runs on Adobe Edge Delivery Services: any branch is served at
# `<branch>--da-express-milo--adobecom.aem.page`. That PREVIEW host is
# auth-gated (401 `access-not-allowed`), while the PUBLISH host
# `*--da-express-milo--adobecom.aem.live` is public. So the visual gate
# captures from a local dev server (below) that serves the diff-applied code
# and proxies public .aem.live content — no credential is needed to verify a
# change on a published Express page.
mechanism: aem-branch-preview

# Installed by the engine only for this tenant's local preview, outside Git
# (the run container ships no aem CLI of its own). Same pin as adobecom/mas.
tools:
  aem:
    package: '@adobe/aem-cli'
    version: '16.20.5'

# Branch preview URL: the share link a reviewer opens (Express PRs link
# .aem.page, signed in) and the base-branch "before" capture. It is the gated
# host — see capture_hosts below for what that means for the before.
pin_pattern: 'https://{branch}--da-express-milo--adobecom.aem.page{page}?martech=off'

# Local serve (preferred): Express's own AEM CLI dev server on the
# materialized worktree. `--url` is the content origin it proxies: the public
# publish host, because the .aem.page preview host would answer 401 to an
# unauthenticated proxy. Verified 2026-10-22: /express/, /express/pricing,
# /express/create/card and /express/templates/ all render with the worktree's
# express/code/scripts/scripts.js. Port 3456 stays clear of milo's 6456 (which
# Express's own `?milolibs=local` maps to) and mas's 3000, since `--stop-other`
# reclaims whichever AEM CLI holds the port.
local:
  cmd: 'aem up --port=3456 --no-open --stop-other --url https://main--da-express-milo--adobecom.aem.live'
  url: 'http://localhost:3456{page}'
  # Every Express host — branch previews, publish hosts and the production
  # domain — carries the same /express/... paths, so a URL pasted on any of
  # them is served by the local server directly (production is never shot).
  # Express is not consumed by other sites through a libs overlay, so the
  # overlay params only keep analytics out of a foreign capture.
  consumer_overlay:
    own_hosts: ['--da-express-milo--', 'www.adobe.com']
    params: 'martech=off'

# Hosts that carry Express pages when a requester pastes a URL in a ticket.
# URLs on hosts not listed here are treated as reference links and ignored.
capture_hosts:
  - '--da-express-milo--adobecom.aem.live'
  # Pasted production URLs (https://www.adobe.com/express/...): served locally
  # by path through own_hosts above.
  - 'www.adobe.com'
  # The gated preview host. A pasted .aem.page URL is served locally by path
  # (own_hosts), so this entry only matters for a remote capture of it, which
  # is swapped to the same path on the public publish host. The base-branch
  # "before" does NOT ride this swap — it signs in or goes without (verified
  # 2026-10-22: before_capture_error HTTP 401, after captured fine; befores
  # are best-effort human evidence). Once AEM_SITE_TOKEN_DA_EXPRESS_MILO is in
  # the engine environment, replace `capture_on` with
  # `auth: da-express-milo-token`: that gives every capture a before and makes
  # preview-only draft pages capturable.
  - host: '--da-express-milo--adobecom.aem.page'
    capture_on: '--da-express-milo--adobecom.aem.live'

auth_profiles:
  # Site token for the gated preview host — dormant until a capture host
  # attaches it (see capture_hosts above). No `mint:`, deliberately (same
  # reasoning as adobecom/mas): the aem CLI login hands back the admin API's
  # auth token, which authenticates nothing on the content host. A site
  # administrator creates a real site token once through the config service
  # (POST admin.hlx.page/config/adobecom/sites/da-express-milo/secrets.json)
  # and the platform team sets it as AEM_SITE_TOKEN_DA_EXPRESS_MILO in the
  # engine environment. Never commit the value.
  da-express-milo-token:
    token_env: AEM_SITE_TOKEN_DA_EXPRESS_MILO
    header: 'authorization: token {token}'

  # The automation account the visual judge's captures sign in with when a
  # capture host attaches `auth: ims`. Dormant: no capture host attaches it
  # yet — Express's published pages are public and served locally, and an IMS
  # sign-in alone does not open the EDS-gated .aem.page host (its login,
  # admin.hlx.page/login/adobecom/da-express-milo/main, leaves the admin API's
  # cookie, not the site's). The site token above is the way in for .aem.page.
  # `username` is declared in the clear; the password is read from the
  # engine's IMS_PASS variable and never lives in this repo.
  ims:
    account:
      username: pinata+masautomation@adobetest.com
      password_env: IMS_PASS
      note: >-
        Has preview access to adobecom/da-express-milo. Verify:
        admin.hlx.page/status/adobecom/da-express-milo/main/ returns
        preview.status 200 (not 403) when signed in as this user.
    idp_hosts: [auth.services.adobe.com, ims-na1.adobelogin.com]
    steps:
      - fill: '#EmailPage-EmailField'
        value_from: username
        timeout_ms: 45000
      - click: '[data-id=EmailPage-ContinueButton]'
      # IMS sometimes ignores Continue: redo email+Continue until the password page shows; toaster = account rejected.
      - fill: '#PasswordPage-PasswordField'
        value_from: password
        timeout_ms: 60000
        retry_previous: 2
        retry_interval_ms: 1000
        retry_max_replays: 4
        abort_on: ['[data-id=EmailPage-Toaster]']
      - click: '[data-id=PasswordPage-ContinueButton]'
      # Profile chooser and passkey nudge are interstitials; skip if absent.
      - click: '[data-id="PP-ProfileChooser-AuthAccount"]'
        optional: true
        timeout_ms: 8000
      - click: 'button:has-text("Skip"), [data-id="PasskeyNudgePage-SkipButton"]'
        optional: true
        timeout_ms: 8000
    settle_ms: 5000

# Known-good capture surfaces. When a ticket declares no visual_targets, the
# harness reads ONLY these ids + descriptions and asks a small model which
# surface best exercises the change; "none fit" skips the gate honestly. Each
# page is a public production page, rendered locally with the branch's code.
# Add an entry per block you want visually verifiable; `match` is an optional
# changed-files hint.
surfaces:
  - id: home
    page: /express/
    mechanism: pin
    description: >-
      The Express homepage: grid-marquee hero, gen-ai-cards, discover-cards,
      quotes and banner, with the global nav and footer. Generic render-smoke
      for the bootstrap (scripts.js, utils.js) — pick ONLY when no more
      specific surface covers the change.
    match: 'express/code/scripts/**'
  - id: styles
    page: /express/
    mechanism: pin
    description: >-
      The Express homepage as a whole-page check of global styles: tokens,
      typography, breakpoints and section spacing from express/code/styles.
    match: 'express/code/styles/**'
  - id: grid-marquee
    page: /express/
    mechanism: pin
    description: >-
      The grid-marquee hero at the top of the Express homepage (headline,
      CTA and the app tile grid).
    match: 'express/code/blocks/grid-marquee/**'
  - id: pricing
    page: /express/pricing
    mechanism: pin
    description: >-
      The Express pricing page: content-toggle-v2 plan switcher, pricing
      cards, pricing-footer and faqv2. Pick for pricing layout and toggle
      changes.
    match: 'express/code/blocks/content-toggle-v2/**'
  - id: pricing-footer
    page: /express/pricing
    mechanism: pin
    description: >-
      The pricing-footer block under the plan cards on the Express pricing
      page.
    match: 'express/code/blocks/pricing-footer/**'
  - id: template-x
    page: /express/create/card
    mechanism: pin
    description: >-
      A create landing page (cards) built around the template-x grid and
      template-x-carousel, plus steps, faq and link-list. Pick for template
      rendering changes.
    match: 'express/code/blocks/template-x/**'
  - id: templates-search
    page: /express/templates/
    mechanism: pin
    description: >-
      The templates hub: search-marquee, seo-nav, template-x and
      blog-posts-v2. Pick for template search and browse UI changes.
    match: 'express/code/blocks/search-marquee/**'

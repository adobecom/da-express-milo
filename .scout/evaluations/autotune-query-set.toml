description = "Express Milo starter search evaluation: 8 identifier, 7 natural-language, 5 filtered queries"

# Source-reviewed file judgments, not labels generated from search rankings.
# Grades: 3 = definitive, 2 = important related implementation, 1 = useful context.
# Unlisted files are unjudged, not verified irrelevant. Review unexpected hits.
# This small development set is not a held-out benchmark or whole-repo census.

[[queries]]
id = "ident-page-loading"

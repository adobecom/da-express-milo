name: Nala Tests Label Trigger

on:
  pull_request:
    types: [ labeled, opened, synchronize, reopened ]

jobs:
  action:
    name: Running Nala E2E UI Tests
    runs-on: ubuntu-24.04
    # Browsers + OS deps are baked into the image (no install step). Keep the
    # tag in sync with @playwright/test and run-nala-default.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --user 1001
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.pull_request.labels.*.name, ' '), 'run-nala')

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: npm-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-fund --prefer-offline

      - name: Verify container browsers match @playwright/test
        shell: bash
        run: |
          missing=0
          for dir in $(npx playwright install --dry-run | awk '/Install location:/ {print $3}'); do
            [[ -d "$dir" ]] || { echo "::error::Missing browser $dir"; missing=1; }
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::Container image does not match @playwright/test $(npx playwright --version). Bump the mcr.microsoft.com/playwright tag in run-nala-default.yml and run-nala-label.yml."
            exit 1
          fi

      - name: Set execute permission for nalarun.sh
        run: chmod +x ./nala/utils/pr.run.sh

      - name: Run Nala Tests via pr.run.sh
        run: ./nala/utils/pr.run.sh
        env:
          labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          branch: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event.pull_request.head.repo.html_url }}
          # Fork branches don't have an AEM Live host under the fork owner.
          # Use the published base-branch preview for fork PRs.
          prOrg: ${{ github.event.pull_request.base.repo.owner.login }}
          prRepo: ${{ github.event.pull_request.base.repo.name }}
          prBranch: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event.pull_request.base.ref }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nala-label-test-results-${{ github.run_number }}
          path: |
            test-results/
            test-html-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

name: Run Nala Tests

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-nala-tests:
    name: Running Nala E2E UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel the other shards when one fails — we want the full picture.
      fail-fast: false
      matrix:
        node-version: [24.x]
        # Split the suite across parallel runner jobs. Playwright's --shard
        # deterministically partitions tests, so 4 shards ≈ 4x throughput.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: npm-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.node-version }}-chromium

      - name: Install dependencies
        run: npm ci --no-fund --prefer-offline

      - name: Install Playwright (all browsers)
        run: npx playwright install --with-deps

      - name: Set execute permission for pr.run.sh
        run: chmod +x ./nala/utils/pr.run.sh

      - name: Run Nala Tests
        run: ./nala/utils/pr.run.sh
        env:
          # PR gate: full cross-browser matrix, sharded across parallel jobs
          # so wall-clock stays low even with all three browsers.
          NALA_PROJECTS: --project=express-live-chromium --project=express-live-firefox --project=express-live-webkit
          SHARD: ${{ matrix.shard }}/4
          labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          branch: ${{ github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event.pull_request.head.repo.html_url }}
          prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
          prRepo: ${{ github.event.pull_request.head.repo.name }}
          prBranch: ${{ github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event.pull_request.base.ref }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nala-test-results-${{ github.run_number }}-shard${{ matrix.shard }}
          path: |
            test-results/
            test-html-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # Single aggregate check for branch protection. `needs.run-nala-tests.result`
  # collapses the whole shard matrix to one value: 'success' only if every shard
  # passed. Make THIS job the required status check so the shard count can change
  # without ever touching branch protection again.
  nala-gate:
    name: Nala Tests Gate
    if: always()
    needs: run-nala-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards passed
        run: |
          result="${{ needs.run-nala-tests.result }}"
          echo "Aggregate shard result: $result"
          if [[ "$result" != "success" ]]; then
            echo "One or more Nala shards did not pass."
            exit 1
          fi
          echo "All Nala shards passed."

name: Run Nala Tests

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  run-nala-tests:
    name: Running Nala E2E UI Tests (${{ matrix.lane_id }})
    runs-on: ubuntu-24.04
    # Chrome and the locked Playwright browsers are baked into this verified
    # private image. Rebuild and update both workflow digests on version changes.
    # Keep browsers non-root; the verifier checks UID, versions and H.264 decoding.
    container:
      image: ghcr.io/adobecom/da-express-milo-nala@sha256:deb7608a0bd3c1060113c76fbcc5588c5a8c418229e629024a1827587f46bf64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
    timeout-minutes: 30
    strategy:
      # Don't cancel the other lanes when one fails — we want the full picture.
      fail-fast: false
      matrix:
        # Lanes run as parallel runner jobs. The non-color suite is split across
        # 4 shards (Playwright's --shard deterministically partitions tests). The
        # heavy color-shared blocks are pulled OUT of the shards (each shard lane
        # excludes @color) and run in their own serial lane (workers=1) so they
        # never cluster on one shard and starve each other's decoration — the
        # cause of the recurring color-block waitReady timeouts.
        include:
          - { lane_id: shard1, node: 24.x, shard: '1/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard2, node: 24.x, shard: '2/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard3, node: 24.x, shard: '3/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard4, node: 24.x, shard: '4/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: color, node: 24.x, shard: '', exclude: '', grep: '@color', workers: '1' }
          # Signed-in (IMS) tests: one unsharded lane so the user signs in once.
          # grep '@login' overrides PR-label tags so the auth setup always runs.
          # Runs only on the release PR (stage -> main), against its own
          # stage-- host; skipped on every other PR/event (see NALA_SKIP_LANE).
          - { lane_id: login, node: 24.x, shard: '', exclude: '', grep: '@login', workers: '1', projects: '--project=express-login-chromium', release_only: true }

    env:
      NALA_SKIP_LANE: ${{ matrix.release_only == true && !(github.base_ref == 'main' && github.head_ref == 'stage') }}

    steps:
      - name: Skip release-only lane
        if: env.NALA_SKIP_LANE == 'true'
        run: echo "::notice title=Nala ${{ matrix.lane_id }} lane skipped::The ${{ matrix.lane_id }} lane only runs on the stage -> main release PR."

      - name: Checkout repository
        if: env.NALA_SKIP_LANE != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Match the deployed preview, not undeployed changes in the merge ref.
          ref: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js ${{ matrix.node }}
        if: env.NALA_SKIP_LANE != 'true'
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: ${{ matrix.node }}

      - name: Cache node_modules
        if: env.NALA_SKIP_LANE != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: npm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: env.NALA_SKIP_LANE != 'true'
        run: npm ci --no-fund --prefer-offline

      - name: Verify container browsers and H.264 decoding
        if: env.NALA_SKIP_LANE != 'true'
        run: node nala/utils/verify-ci-browsers.cjs

      - name: Set execute permission for pr.run.sh
        if: env.NALA_SKIP_LANE != 'true'
        run: chmod +x ./nala/utils/pr.run.sh

      - name: Run Nala Tests
        if: env.NALA_SKIP_LANE != 'true'
        run: ./nala/utils/pr.run.sh
        env:
          # PR gate: full cross-browser matrix, sharded across parallel jobs
          # so wall-clock stays low even with all three browsers.
          NALA_PROJECTS: ${{ matrix.projects || '--project=express-live-chromium --project=express-live-firefox --project=express-live-webkit' }}
          # Sharded lanes: SHARD set + exclude @color. Color lane: no shard,
          # grep only @color, workers=1 (serial).
          SHARD: ${{ matrix.shard }}
          NALA_EXTRA_GREP_INVERT: ${{ matrix.exclude }}
          NALA_GREP: ${{ matrix.grep }}
          NALA_WORKERS: ${{ matrix.workers }}
          labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          branch: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event.pull_request.head.repo.html_url }}
          # Fork branches don't have an AEM Live host under the fork owner.
          # Use the published base-branch preview for fork PRs.
          prOrg: ${{ github.event.pull_request.base.repo.owner.login }}
          prRepo: ${{ github.event.pull_request.base.repo.name }}
          prBranch: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event.pull_request.base.ref }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}

      - name: Upload test results and screenshots
        if: always() && env.NALA_SKIP_LANE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nala-test-results-${{ github.run_number }}-${{ matrix.lane_id }}
          path: |
            test-results/
            test-html-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # Single aggregate check for branch protection. `needs.run-nala-tests.result`
  # collapses the whole shard matrix to one value: 'success' only if every shard
  # passed. Make THIS job the required status check so the shard count can change
  # without ever touching branch protection again.
  nala-gate:
    name: Nala Tests Gate
    if: always()
    needs: run-nala-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards passed
        run: |
          result="${{ needs.run-nala-tests.result }}"
          echo "Aggregate shard result: $result"
          if [[ "$result" != "success" ]]; then
            echo "One or more Nala shards did not pass."
            exit 1
          fi
          echo "All Nala shards passed."

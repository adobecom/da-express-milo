name: Run Nala Tests

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-nala-tests:
    name: Running Nala E2E UI Tests (${{ matrix.lane_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't cancel the other lanes when one fails — we want the full picture.
      fail-fast: false
      matrix:
        # Lanes run as parallel runner jobs. The non-color suite is split across
        # 4 shards (Playwright's --shard deterministically partitions tests). The
        # heavy color-shared blocks are pulled OUT of the shards (each shard lane
        # excludes @color) and run in their own serial lane (workers=1) so they
        # never cluster on one shard and starve each other's decoration — the
        # cause of the recurring color-block waitReady timeouts.
        include:
          - { lane_id: shard1, node: 24.x, shard: '1/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard2, node: 24.x, shard: '2/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard3, node: 24.x, shard: '3/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: shard4, node: 24.x, shard: '4/4', exclude: '@color', grep: '', workers: '' }
          - { lane_id: color, node: 24.x, shard: '', exclude: '', grep: '@color', workers: '1' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: ${{ matrix.node }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: npm-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.node }}-chromium

      - name: Install dependencies
        run: npm ci --no-fund --prefer-offline

      - name: Install Playwright (all browsers)
        # Normally ~40s, but a slow Ubuntu package mirror (via --with-deps) has
        # been observed dragging this to ~7min while still succeeding. A truly
        # hung mirror would otherwise stall until the 30-min job timeout,
        # wasting a runner and failing the whole PR. Cap above the slow-but-fine
        # ceiling so a genuine hang fails fast and a re-run recovers.
        timeout-minutes: 10
        run: npx playwright install --with-deps

      - name: Set execute permission for pr.run.sh
        run: chmod +x ./nala/utils/pr.run.sh

      - name: Run Nala Tests
        run: ./nala/utils/pr.run.sh
        env:
          # PR gate: full cross-browser matrix, sharded across parallel jobs
          # so wall-clock stays low even with all three browsers.
          NALA_PROJECTS: --project=express-live-chromium --project=express-live-firefox --project=express-live-webkit
          # Sharded lanes: SHARD set + exclude @color. Color lane: no shard,
          # grep only @color, workers=1 (serial).
          SHARD: ${{ matrix.shard }}
          NALA_EXTRA_GREP_INVERT: ${{ matrix.exclude }}
          NALA_GREP: ${{ matrix.grep }}
          NALA_WORKERS: ${{ matrix.workers }}
          labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          branch: ${{ github.event.pull_request.head.ref }}
          repoName: ${{ github.repository }}
          prUrl: ${{ github.event.pull_request.head.repo.html_url }}
          prOrg: ${{ github.event.pull_request.head.repo.owner.login }}
          prRepo: ${{ github.event.pull_request.head.repo.name }}
          prBranch: ${{ github.event.pull_request.head.ref }}
          prBaseBranch: ${{ github.event.pull_request.base.ref }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          IMS_EMAIL: ${{ secrets.IMS_EMAIL }}
          IMS_PASS: ${{ secrets.IMS_PASS }}

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nala-test-results-${{ github.run_number }}-${{ matrix.lane_id }}
          path: |
            test-results/
            test-html-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # Single aggregate check for branch protection. `needs.run-nala-tests.result`
  # collapses the whole shard matrix to one value: 'success' only if every shard
  # passed. Make THIS job the required status check so the shard count can change
  # without ever touching branch protection again.
  nala-gate:
    name: Nala Tests Gate
    if: always()
    needs: run-nala-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards passed
        run: |
          result="${{ needs.run-nala-tests.result }}"
          echo "Aggregate shard result: $result"
          if [[ "$result" != "success" ]]; then
            echo "One or more Nala shards did not pass."
            exit 1
          fi
          echo "All Nala shards passed."

name: Slack Release Notification

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (uses test webhook)'
        required: false
        default: false
        type: boolean

env:
  # Webhook URL (required)
  SLACK_WEBHOOK_URL: ${{ (github.event.inputs.test_mode == 'true' || (github.event_name == 'pull_request' && contains(github.event.label.name, 'test-release-notification'))) && secrets.SLACK_WEBHOOK_URL_TEST || secrets.SLACK_WEBHOOK_URL }}
  # Express Agent Bot token for pinning messages
  SLACK_BOT_TOKEN: ${{ (github.event.inputs.test_mode == 'true' || (github.event_name == 'pull_request' && contains(github.event.label.name, 'test-release-notification'))) && secrets.SLACK_EXPRESS_AGENT_BOT_TOKEN_TEST || secrets.SLACK_EXPRESS_AGENT_BOT_TOKEN }}
  # Express Agent channel ID for pinning messages
  SLACK_CHANNEL_ID: ${{ (github.event.inputs.test_mode == 'true' || (github.event_name == 'pull_request' && contains(github.event.label.name, 'test-release-notification'))) && secrets.SLACK_EXPRESS_AGENT_CHANNEL_ID_TEST || secrets.SLACK_EXPRESS_AGENT_CHANNEL_ID }}

jobs:
  notify-release:
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'adobecom' && 
      (github.ref == 'refs/heads/main' || 
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'test-release-notification'))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Extract PR information
        id: extract-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // 1. Find the release PR (the PR merged into main that triggered this run)
            let releasePr = null;
            if (context.eventName === 'pull_request') {
              releasePr = context.payload.pull_request;
            } else {
              const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: context.sha,
              });
              releasePr = associated.find((pr) => pr.base.ref === 'main' && pr.merged_at);
            }
            if (!releasePr) {
              const { data: closed } = await github.rest.pulls.list({
                owner,
                repo,
                base: 'main',
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 20,
              });
              releasePr = closed
                .filter((pr) => pr.merged_at)
                .sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at))[0];
            }
            if (!releasePr) {
              core.setOutput('prList', 'No release PR found');
              return;
            }
            console.log(`Release PR: #${releasePr.number} "${releasePr.title}"`);

            // 2. Resolve the PRs included in the release from the release PR's commits
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: releasePr.number,
              per_page: 100,
            });
            console.log(`Release PR contains ${commits.length} commits`);

            const prNumbers = [];
            for (const commit of commits) {
              const headline = commit.commit.message.split('\n')[0];
              // Skip sync merges (e.g. "Merge branch 'main' into stage")
              if (commit.parents.length > 1 && !/^Merge pull request #\d+/.test(headline)) continue;

              const match = headline.match(/\(#(\d+)\)\s*$/) || headline.match(/^Merge pull request #(\d+)/);
              let prNumber = match ? parseInt(match[1], 10) : null;
              if (!prNumber) {
                try {
                  const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner,
                    repo,
                    commit_sha: commit.sha,
                  });
                  const pr = associated.find((p) => p.merged_at && p.number !== releasePr.number);
                  prNumber = pr ? pr.number : null;
                } catch (error) {
                  console.log(`Failed to look up PRs for ${commit.sha}: ${error.message}`);
                }
              }
              if (prNumber && prNumber !== releasePr.number && !prNumbers.includes(prNumber)) {
                prNumbers.push(prNumber);
              }
            }
            // Hotfixes merged directly into main have no nested PRs; list the PR itself
            if (prNumbers.length === 0) prNumbers.push(releasePr.number);
            console.log(`PRs in release: ${prNumbers.join(', ')}`);

            // 3. Build the list with Jira links where a ticket is available
            const ticketPattern = /MWPW-\d+/;
            const prList = [];
            for (const prNumber of prNumbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const title = pr.title;
                const ticketNumber = (title.match(ticketPattern) || (pr.body || '').match(ticketPattern) || [])[0];
                const cleanTitle = title
                  .replace(/[([]?MWPW-\d+[)\]]?/g, '')
                  .replace(/^[\s:\-|]+/, '')
                  .replace(/\s{2,}/g, ' ')
                  .trim() || title;
                const safeTitle = cleanTitle.replace(/[<>|]/g, '').replace(/&/g, '&amp;');

                if (ticketNumber) {
                  prList.push(`- <https://jira.corp.adobe.com/browse/${ticketNumber}|${ticketNumber}: ${safeTitle}> (<${pr.html_url}|#${prNumber}>)`);
                } else {
                  prList.push(`- <${pr.html_url}|${safeTitle}> (#${prNumber})`);
                }
                console.log(`PR #${prNumber}: "${cleanTitle}" ${ticketNumber ? `(Ticket: ${ticketNumber})` : '(No ticket found)'}`);
              } catch (error) {
                console.log(`Failed to get PR #${prNumber}: ${error.message}`);
              }
            }

            core.setOutput('prList', prList.join('\n') || 'No PRs found');

      - name: Build Slack payload
        id: build-payload
        if: steps.extract-prs.outputs.prList != ''
        env:
          PR_LIST: ${{ steps.extract-prs.outputs.prList }}
          TEST_SUFFIX: ${{ (github.event.inputs.test_mode == 'true' || (github.event_name == 'pull_request' && contains(github.event.label.name, 'test-release-notification'))) && ' (TEST MODE)' || '' }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          SHORT_SHA: ${{ steps.short-sha.outputs.short-sha }}
        run: |
          jq -n \
            --arg prList "$PR_LIST" \
            --arg testSuffix "$TEST_SUFFIX" \
            --arg commitUrl "$COMMIT_URL" \
            --arg shortSha "$SHORT_SHA" \
            '{
              text: "<!subteam^S07RK2JSX8X|@ax-devs> <!subteam^S07QX6W03UN|@acom-express-pdms> 🚀 *Express Milo Release Deployed*\($testSuffix)",
              attachments: [
                {
                  color: "#0066cc",
                  fields: [
                    { title: "🌿 Branch", value: "main", short: true },
                    { title: "🔗 Commit", value: "<\($commitUrl)|\($shortSha)>", short: true }
                  ]
                },
                {
                  color: "#ff6b35",
                  fields: [
                    {
                      title: "🌐 Test URLs",
                      value: "• <https://main--da-express-milo--adobecom.aem.page/express|main--da-express-milo--adobecom.aem.page/express>\n• <https://adobecom.com/express|adobecom.com/express>",
                      short: false
                    }
                  ]
                },
                {
                  color: "#28a745",
                  fields: [
                    { title: "📋 Changes in this Release", value: $prList, short: false }
                  ]
                }
              ]
            }' > slack-payload.json
          cat slack-payload.json

      - name: Send release notification with bot token
        if: env.SLACK_BOT_TOKEN != '' && steps.build-payload.outcome == 'success'
        id: send-notification
        run: |
          echo "📤 Sending release notification with bot token..."
          
          # Use bot token to send message and get message details
          MESSAGE_RESPONSE=$(jq --arg channel "${{ env.SLACK_CHANNEL_ID }}" '. + {channel: $channel}' slack-payload.json | \
            curl -s -X POST -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @- \
            "https://slack.com/api/chat.postMessage")
          
          echo "Message response: $MESSAGE_RESPONSE"
          
          # Extract message timestamp for pinning
          MESSAGE_TS=$(echo "$MESSAGE_RESPONSE" | jq -r '.ts')
          if [ "$MESSAGE_TS" != "null" ] && [ "$MESSAGE_TS" != "" ]; then
            echo "MESSAGE_TS=$MESSAGE_TS" >> $GITHUB_OUTPUT
            echo "✅ Message sent successfully with timestamp: $MESSAGE_TS"
          else
            echo "❌ Failed to get message timestamp"
            exit 1
          fi

      - name: Send release notification with webhook (fallback)
        if: env.SLACK_WEBHOOK_URL != '' && env.SLACK_BOT_TOKEN == '' && steps.build-payload.outcome == 'success'
        id: send-notification-webhook
        run: |
          echo "📤 Sending release notification with webhook (no pinning available)..."
          
          curl -X POST -H 'Content-type: application/json; charset=utf-8' \
            --data-binary @slack-payload.json \
            ${{ env.SLACK_WEBHOOK_URL }}
          
          echo "✅ Webhook notification sent (no pinning available)"

      - name: Pin release message
        if: env.SLACK_BOT_TOKEN != '' && steps.send-notification.outcome == 'success'
        run: |
          echo "📌 Pinning release message..."
          
          # Use the message timestamp from the bot token response
          MESSAGE_TS="${{ steps.send-notification.outputs.MESSAGE_TS }}"
          CHANNEL_ID="${{ env.SLACK_CHANNEL_ID }}"
          
          if [ -z "$MESSAGE_TS" ] || [ -z "$CHANNEL_ID" ]; then
            echo "⚠️ Missing MESSAGE_TS or CHANNEL_ID, skipping pin"
            exit 0
          fi
          
          echo "📌 Pinning message with timestamp: $MESSAGE_TS"
          
          # Pin the message
          PIN_RESPONSE=$(curl -s -X POST -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"$CHANNEL_ID\",\"timestamp\":\"$MESSAGE_TS\"}" \
            "https://slack.com/api/pins.add")
          
          echo "Pin response: $PIN_RESPONSE"
          
          # Check if pin was successful
          PIN_SUCCESS=$(echo "$PIN_RESPONSE" | jq -r '.ok')
          if [ "$PIN_SUCCESS" = "true" ]; then
            echo "✅ Message pinned successfully!"
          else
            echo "❌ Failed to pin message: $(echo "$PIN_RESPONSE" | jq -r '.error')"
          fi

      - name: Fallback notification
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          echo "❌ Release notification failed"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
